name: CekSepet
options:
  bundleIdPrefix: com.ceksepet
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: tr
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
configs:
  Debug: debug
  Release: release
targets:
  CekSepet:
    type: application
    platform: iOS
    sources:
      - CekSepet
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ceksepet.ios
        INFOPLIST_FILE: CekSepet/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  CekSepetTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CekSepetTests]
    dependencies:
      - target: CekSepet
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  CekSepetUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CekSepetUITests]
    dependencies:
      - target: CekSepet
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CekSepet:
    build:
      targets:
        CekSepet: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [CekSepetTests, CekSepetUITests]
      gatherCoverageData: true
    archive:
      config: Release
